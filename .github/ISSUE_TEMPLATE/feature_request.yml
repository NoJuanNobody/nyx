name: Feature request
description: Suggest an improvement or new capability
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please note the project's scope: Nyx has no embedded AI agent or chat, and credits are agent-native utility tokens that are never sold. Requests for purchase flows or an in-app agent will be closed.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core crate (nyx-core)
        - CLI (nyx)
        - MCP tool
        - Desktop app
        - Credits / ledger
        - Lifecycle pipeline
        - API
        - Web UI
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen. For an MCP tool, include the name, inputs and outputs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
    validations:
      required: true
