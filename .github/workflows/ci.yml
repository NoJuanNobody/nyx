name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: nyx_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/nyx_test

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for gitleaks
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: License check
        run: npx license-checker --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: nyx_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Enable pgvector extension
        run: PGPASSWORD=testpassword psql -h localhost -U postgres -d nyx_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Push database schema
        run: pnpm --filter api exec drizzle-kit push --force
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/nyx_test
      - name: Build packages
        run: pnpm build
      - name: Start API server
        run: |
          cd apps/api && node dist/index.js &
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "API ready!"
              break
            fi
            sleep 2
          done
        env:
          NODE_ENV: development
          DEV_AUTH_BYPASS: "true"
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/nyx_test
          PORT: "3001"
      - name: Start frontend
        run: |
          cd apps/web && npx vite preview --port 5173 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite ready!"
              break
            fi
            sleep 2
          done
      - name: Run smoke tests
        run: PLAYWRIGHT_SKIP_WEBSERVER=1 pnpm test:smoke
        env:
          CI: true
          NODE_ENV: development
          DEV_AUTH_BYPASS: "true"
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/nyx_test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: nyx_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Enable pgvector extension
        run: PGPASSWORD=testpassword psql -h localhost -U postgres -d nyx_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Push database schema
        run: pnpm --filter api exec drizzle-kit push --force
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/nyx_test
      - name: Build packages
        run: pnpm build
      - name: Start API server
        run: |
          cd apps/api && node dist/index.js &
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "API ready!"
              break
            fi
            sleep 2
          done
        env:
          NODE_ENV: development
          DEV_AUTH_BYPASS: "true"
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/nyx_test
          PORT: "3001"
      - name: Start frontend
        run: |
          cd apps/web && npx vite preview --port 5173 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite ready!"
              break
            fi
            sleep 2
          done
      - name: Run E2E tests
        run: PLAYWRIGHT_SKIP_WEBSERVER=1 pnpm test:e2e
        env:
          CI: true
          NODE_ENV: development
          DEV_AUTH_BYPASS: "true"
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/nyx_test