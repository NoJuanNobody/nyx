name: E2E Auto-Fix

# ─────────────────────────────────────────────────────────────────────────────
# Triggers whenever ANY check suite completes with a failure on this repo.
# No workflow names to hardcode — it catches every failing check automatically.
# ─────────────────────────────────────────────────────────────────────────────
on:
  check_suite:
    types: [completed]

# Prevent overlapping fix runs on the same branch
concurrency:
  group: auto-fix-${{ github.event.check_suite.head_branch }}
  cancel-in-progress: true

jobs:
  auto-fix:
    # Only run when a check suite actually failed, and skip our OWN workflow
    # to avoid an infinite fix-of-fix loop.
    if: |
      github.event.check_suite.conclusion == 'failure' &&
      github.event.check_suite.app.slug != 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write      # push fixes back to the branch
      actions: read        # fetch logs from the failed run
      checks: read         # read check suite details

    steps:
      # ── 1. Checkout the FAILING branch (not the default branch) ─────────────
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.check_suite.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set the branch name and configure git ────────────────────────────
      - name: Configure git
        run: |
          git config user.name  "claude-auto-fix[bot]"
          git config user.email "claude-auto-fix[bot]@users.noreply.github.com"
          BRANCH="${{ github.event.check_suite.head_branch }}"
          git checkout -B "$BRANCH" --track "origin/$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # ── 3. Fetch failure logs — resolve the workflow run from the check suite
      - name: Fetch failure logs
        id: fetch-logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_SUITE_ID: ${{ github.event.check_suite.id }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # Resolve the Actions run ID from the check suite
          RUN_ID=$(gh api "/repos/$REPO/actions/runs" \
            --jq ".workflow_runs[] | select(.head_sha == \"$HEAD_SHA\" and .conclusion == \"failure\") | .id" \
            | head -1)

          if [ -z "$RUN_ID" ]; then
            echo "[Could not resolve a failed Actions run for SHA $HEAD_SHA]" > /tmp/failure-logs.txt
          else
            echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
            RUN_ID=$RUN_ID REPO=$REPO bash .github/scripts/fetch-failure-logs.sh
          fi

      # ── 4. Install Node + Claude Code ───────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # ── 5. Install project dependencies (adjust for your stack) ─────────────
      - name: Install project dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci
          elif [ -f "yarn.lock" ]; then yarn install --frozen-lockfile
          elif [ -f "pnpm-lock.yaml" ]; then npx pnpm install --frozen-lockfile
          fi

      # ── 6. Run Claude Code in headless mode with the failure context ─────────
      - name: Run Claude Code auto-fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LOGS=$(cat /tmp/failure-logs.txt)
          BRANCH="${{ env.BRANCH }}"

          claude -p "
          You are an autonomous E2E test fixer. A CI pipeline has failed.
          Your job is to diagnose and fix the root cause, then commit the fix.

          ## Context
          - Repository: ${{ github.repository }}
          - Branch: $BRANCH
          - Failing workflow run: ${{ env.RUN_ID }}

          ## Failure logs
          \`\`\`
          $LOGS
          \`\`\`

          ## Instructions
          1. Read the logs carefully to understand EXACTLY what failed and why.
          2. Explore the relevant source files (tests, components, API routes, configs).
          3. Identify the minimal, targeted fix — do NOT rewrite unrelated code.
          4. Apply the fix(es) to the appropriate file(s).
          5. Run the tests locally if possible to verify the fix: \`npm test\` or the relevant test command.
          6. Stage and commit ONLY the changed files with a clear message:
             \`git add <files> && git commit -m 'fix(e2e): <concise description of fix>'\`
          7. Do NOT push — the workflow will push after you finish.
          8. If you cannot determine a safe fix, output: CANNOT_FIX: <reason>

          Focus on correctness. Leave code style and unrelated improvements alone.
          " \
          --dangerously-skip-permissions \
          --max-turns 15 \
          --allowedTools "Read,Write,Edit,Bash,Glob,Grep,MultiEdit" \
          2>&1 | tee /tmp/claude-output.log

      # ── 7. Check if Claude made any commits ─────────────────────────────────
      - name: Check for commits
        id: check-commits
        run: |
          COUNT=$(git log origin/${{ env.BRANCH }}..HEAD --oneline | wc -l)
          echo "new_commits=$COUNT" >> $GITHUB_OUTPUT
          echo "Claude made $COUNT new commit(s)"

      # ── 8. Push the fix back to the same branch ──────────────────────────────
      - name: Push fix
        if: steps.check-commits.outputs.new_commits > 0
        run: |
          git push origin HEAD:${{ env.BRANCH }}
          echo "✅ Fix pushed to ${{ env.BRANCH }}"

      # ── 9. Post a summary to the workflow run ────────────────────────────────
      - name: Post summary
        if: always()
        run: |
          COMMITS="${{ steps.check-commits.outputs.new_commits }}"
          if [ "$COMMITS" -gt "0" ]; then
            echo "## ✅ Claude Auto-Fix Applied" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** \`${{ env.BRANCH }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Commits pushed:** $COMMITS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Claude's output" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/claude-output.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Fix Applied" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the Actions run for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Claude's output" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat /tmp/claude-output.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
