name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: PostgreSQL Backup
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        run: |
          pg_dump "$DATABASE_PUBLIC_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file=nyx-backup-$(date +%Y%m%d-%H%M%S).dump
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}

      - name: Verify backup file
        run: |
          DUMP_FILE=$(ls -1 nyx-backup-*.dump)
          FILE_SIZE=$(stat --format=%s "$DUMP_FILE")
          echo "Backup file: $DUMP_FILE ($FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -eq 0 ]; then
            echo "::error::Backup file is empty"
            exit 1
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: nyx-backup-*.dump
          retention-days: 30
