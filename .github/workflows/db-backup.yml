name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: PostgreSQL Backup
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check database URL
        run: |
          if [ -z "$DATABASE_PUBLIC_URL" ]; then
            echo "::error::DATABASE_PUBLIC_URL secret is not set"
            exit 1
          fi
          echo "DATABASE_PUBLIC_URL is set (length: ${#DATABASE_PUBLIC_URL})"
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}

      - name: Run pg_dump
        run: |
          DUMP_FILE="nyx-backup-$(date +%Y%m%d-%H%M%S).dump"
          # Append sslmode=require if not already in the URL (Railway proxy requires SSL)
          DUMP_URL="${DATABASE_PUBLIC_URL}"
          if [[ "$DUMP_URL" != *"sslmode="* ]]; then
            DUMP_URL="${DUMP_URL}?sslmode=require"
          fi
          pg_dump "$DUMP_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="$DUMP_FILE"
          echo "DUMP_FILE=$DUMP_FILE" >> $GITHUB_ENV
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}

      - name: Verify backup file
        run: |
          FILE_SIZE=$(stat --format=%s "$DUMP_FILE")
          echo "Backup file: $DUMP_FILE ($FILE_SIZE bytes)"
          if [ "$FILE_SIZE" -eq 0 ]; then
            echo "::error::Backup file is empty"
            exit 1
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: nyx-backup-*.dump
          retention-days: 30
