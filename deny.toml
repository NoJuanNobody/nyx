# cargo-deny configuration. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Unmaintained-crate notices only; revisit when tauri/gtk move off GTK3.
ignore = [
  # proc-macro-error via gtk3-macros (Tauri Linux backend); no fix available.
  "RUSTSEC-2024-0370",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.8
# Workspace crates carry `LicenseRef-TBD` until the project license is chosen.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
