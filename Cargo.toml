[workspace]
resolver = "2"
members = ["crates/nyx-core", "crates/nyx-net", "crates/nyx-app", "crates/nyx-cli", "crates/nyx-mcp", "apps/desktop/src-tauri"]
# Plain `cargo build/test` skips the Tauri shell (needs system webview libs on Linux).
# Use `--workspace` or `-p nyx-desktop` to include it. See docs/rust-workspace.md.
default-members = ["crates/nyx-core", "crates/nyx-net", "crates/nyx-app", "crates/nyx-cli", "crates/nyx-mcp"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-TBD"
repository = "https://github.com/NoJuanNobody/nyx"
publish = false

[workspace.dependencies]
nyx-core = { path = "crates/nyx-core" }
nyx-app = { path = "crates/nyx-app" }
nyx-mcp = { path = "crates/nyx-mcp" }
nyx-net = { path = "crates/nyx-net" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
# The resolver/connector API we plug into is "unversioned" and changed shape between 3.4 and 3.5,
# so stay on the minor we built against.
ureq = { version = "~3.5", default-features = false, features = ["rustls"] }
tauri = "2"
tauri-build = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
